<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIN-SHIELD — Advertisement Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Flash-prevention: runs synchronously before any CSS or React hydration.
      Reads localStorage; falls back to OS preference; defaults to dark.
      Adds the correct class to <html> immediately.
    -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('fin-shield-theme'); } catch (e) {}
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
